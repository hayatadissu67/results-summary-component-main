<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet"  href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>



<body>
<div class="big_container">
  <div class="left_container">
 <h3>Your Result</h3>
  <div class="circle">

 <span class="score">76</span>
  <span class="out-of">of 100</span>
</div>
 <div class="result-bottom">
        <h1>Great</h1>

        <p>
            You scored higher than 65% of
            the people who have taken these tests.
        </p>
    </div>
  </div>
  <div class="summary">

    <h2>Summary</h2>
   <div class="sum">
    <div class="summary-reaction">
      <div class="category1">
      <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
        <span > Reaction</span>
        </div>
        <span class="score-1">80 <small>/ 100</small></span>
    </div>
       
    <div class="summary-memory">
      <div class="category2">
        <img src="./assets/images/icon-memory.svg" alt="memory icon">
        <span >Memory</span>
        </div>
        <span class="score-1">92 <small>/ 100</small></span>
    </div>

    <div class="summary-verbal">
      <div class="category3">
      <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
        <span >Verbal</span>
        </div>
        <span class="score-1">61 <small>/ 100</small></span>
    </div>

    <div class="summary-visual">
      <div class="category4">
      <img src="./assets/images/icon-visual.svg" alt="visual icon">
        <span >Visual</span>
        </div>
        <span class="score-1">73 <small>/ 100</small></span>
    </div>
  </div>
    <button>Continue</button>

</div>
  </div>
  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->

</body>
</html>
